<div class="fx-row fx-align-start-center" mat-dialog-title>
    <h2 class="headline m-0 fx-auto">{{'addEthnicity'|translate}}</h2>

    <button class="text-secondary" mat-dialog-close mat-icon-button type="button">
        <mat-icon>{{ icClose }}</mat-icon>
    </button>
</div>
<mat-divider class="-mx-6 text-border"></mat-divider>

<mat-dialog-content class="fx-column" [formGroup]="form">
    
    <mat-form-field class="mt-6" appearance="outline" color="primary">
        <mat-label>{{'title' | translate}}</mat-label>
        <input cdkFocusInitial matInput formControlName="lovColumnValue" name="lovColumnValue" required>
        <mat-error *ngIf="form.get('lovColumnValue').hasError('required')">{{'titleIsRequired'|translate}}</mat-error>
    </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions class="py-6 fx-row fx-align-end-center">
    <button mat-button (click)="cancel()" type="button">{{'cancel' | translate}}</button>
    <button color="primary" (click)="submit()" mat-raised-button type="submit">{{editMode?'Update':'Submit' | translate}}</button>
</mat-dialog-actions>
