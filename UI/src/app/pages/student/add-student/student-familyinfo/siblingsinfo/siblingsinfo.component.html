<div class="grid grid-cols-1 md:grid-cols-2 md:gap-x-8 gap-y-6">
    <div class="border border-solid rounded p-4" *ngFor="let sibling of studentViewSibling.studentMaster">
        <div class="fx-row fx-align-start-center fx-gap-16">
            <div class="relative cursor-pointer fx-none" (click)='openViewDetails(sibling)'>
                <img src="{{sibling.studentThumbnailPhoto?'data:image/png;base64,'+ sibling.studentThumbnailPhoto:'assets/img/default-person.jpg'}}" alt="Student's sibling photo" class="avatar" />
            </div>
            <div class="overflow-hidden cursor-pointer fx-auto" (click)='openViewDetails(sibling)'>
                <div class="subheading-2 leading-snug text-primary">{{sibling.firstGivenName +' '+ sibling.lastFamilyName}}</div>
                <div class="body-1 text-secondary truncate contact-type">{{sibling?.schoolMaster?.schoolName}}
                    <span *ngIf="sibling.studentEnrollment[0]?.gradeLevelTitle" class="separator"></span>{{sibling?.studentEnrollment[0]?.gradeLevelTitle}}</div>
            </div>
            <div class="fx-none fx-column fx-align-center-end">
                <button *ngIf="permissions.edit" mat-icon-button matTooltip="{{'removeAssociation' | translate}}" (click)="confirmDelete(sibling)" type="button" class="text-gray">
                    <mat-icon>{{ icRemove }}</mat-icon>
                </button>
            </div>
        </div>
    </div>
    
</div>
<div class="text-center" *ngIf="!studentViewSibling?.studentMaster?.length">
    {{'noSiblingFound' | translate}}!
</div>
<div class="text-center mt-6">
    <button *ngIf="permissions.add" color="primary" mat-raised-button type="button" (click)='openAddNew()'>
        <mat-icon class="ltr:-ml-1 rtl:-mr-1 ltr:mr-2 rtl:ml-2">{{ icAdd }}</mat-icon>
        <span>{{'addSibling' | translate}}</span>
    </button>
</div>
