<vex-mat-spinner-overlay *ngIf="loading" color="accent"></vex-mat-spinner-overlay>
<div class="card p-4 mb-6 schoolwide-schedule-report">
    <div>
        <div class="flex justify-center items-center w-full pb-2">
            <button (click)="changeWeek('prev')" *ngIf="isPreviousButtonEnabled" class="mx-2">
                <mat-icon class="align-middle mt-0">west</mat-icon>
            </button>
            <div class="md:flex text-center items-center" (click)="startPicker.open()">
                <input matInput [matDatepicker]="startPicker" class="text-lg cursor-pointer font-medium" [min]="calendarDataViewModel.startDate" [max]="calendarDataViewModel.endDate" [size]="calStartDate.value.length > 0 ? calStartDate.value.length: 1" (dateChange)="startDateChange()" disabled [(ngModel)]="startDate" #calStartDate>
                <mat-datepicker-toggle matSuffix [for]="startPicker">
                </mat-datepicker-toggle>
                <mat-datepicker #startPicker disabled="false"></mat-datepicker>
            </div>
            <div class="font-medium mx-4">-</div>
            <div class="md:flex text-center items-center" (click)="endPicker.open()">
                <input matInput [matDatepicker]="endPicker" class="text-lg cursor-pointer font-medium" [min]="calendarDataViewModel.startDate" [max]="calendarDataViewModel.endDate" [size]="calEndDate.value.length > 0 ? calEndDate.value.length: 1" (dateChange)="endDateChange()" disabled [(ngModel)]="endDate" #calEndDate>
                <mat-datepicker-toggle matSuffix [for]="endPicker">
                </mat-datepicker-toggle>
                <mat-datepicker #endPicker disabled="false"></mat-datepicker>
            </div>
            <button (click)="changeWeek('next')" *ngIf="isNextButtonEnabled" class="mx-2">
                <mat-icon class="align-middle mt-0">east</mat-icon>
            </button>
        </div>
    </div>
    <mat-divider class="-mx-4 my-2 border-normal"></mat-divider>
    <div>
        <div class="overflow-x-auto overflow-y-hidden -mx-4">
            <table class="w-full timetable-grid" *ngIf="timetableGrid?.length && schoolDays?.length">
                <thead>
                    <tr>
                        <th class="bg-primary-light period-col">
                            <p class="text-primary font-medium text-base">{{ 'period' | translate }}</p>
                        </th>
                        <th class="day-col" *ngFor="let day of schoolDays"
                            [ngClass]="day.isHoliday ? 'bg-red-light' : 'bg-primary-light'">
                            <p class="font-medium text-base" [ngClass]="day.isHoliday ? 'text-red' : 'text-primary'">
                                {{ day.dayName }}
                            </p>
                            <p class="text-xs opacity-60">{{ day.date | date:'shortDate' }}</p>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of timetableGrid">
                        <td class="bg-primary-light period-col">
                            <p class="text-primary font-medium text-sm">{{ row.periodTitle }}</p>
                            <p class="text-xs opacity-50" *ngIf="row.periodTime">{{ row.periodTime }}</p>
                        </td>
                        <td *ngFor="let cell of row.cells"
                            [ngClass]="cell.isHoliday ? 'bg-red-light' : (cell.entries?.length ? 'bg-base' : 'bg-white')">
                            <ng-container *ngIf="!cell.isHoliday">
                                <div *ngFor="let entry of cell.entries" class="cell-entry">
                                    <p class="text-sm font-medium">{{ entry.courseName }}</p>
                                    <p class="text-xs opacity-60">{{ entry.staffName }}</p>
                                </div>
                            </ng-container>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div *ngIf="!loading && (!timetableGrid?.length || !schoolDays?.length)" class="text-center py-8">
                <p class="text-base">{{ 'noRecordFound' | translate }}</p>
            </div>
        </div>
    </div>
</div>
