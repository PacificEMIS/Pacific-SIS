<div class="dropdown absolute left-0 top-6">
  <div class="dropdown-header fx-row fx-align-between-center">
    <div>
      <div class="dropdown-heading">Notifications</div>
      <div class="dropdown-subheading">You have {{ notifications.length }} new notifications.</div>
    </div>

    <button [matMenuTriggerFor]="settingsMenu" mat-icon-button type="button">
      <mat-icon class="notifications-header-icon">{{ icSettings }}</mat-icon>
    </button>
  </div>

  <div class="dropdown-content">
    <a *ngFor="let notification of notifications; trackBy: trackById"
       [class.read]="notification.read"
       [routerLink]="[]"
       class="notification fx-row fx-align-start-center"
       matRipple>
      <mat-icon
               [ngClass]="notification.colorClass"
               class="notification-icon fx-none">{{ notification.icon }}</mat-icon>
      <div class="fx-auto">
        <div class="notification-label">{{ notification.label }}</div>
        <div class="notification-description">{{ notification.datetime | relativeDateTime }}</div>
      </div>
      <mat-icon class="notification-chevron fx-none">{{ icChevronRight }}</mat-icon>
    </a>
  </div>

  <div class="dropdown-footer fx-row fx-align-center-center">
    <button color="primary" mat-button type="button">MARK ALL AS READ</button>
  </div>
</div>

<mat-menu #settingsMenu="matMenu" xPosition="before" yPosition="below">
  <button mat-menu-item>
    <mat-icon>{{ icClearAll }}</mat-icon>
    <span>Mark all as read</span>
  </button>

  <button mat-menu-item>
    <mat-icon>{{ icNotificationsOff }}</mat-icon>
    <span>Disable Notifications</span>
  </button>
</mat-menu>
